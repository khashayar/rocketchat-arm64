name: Docker Publish

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Docker Hub has immutable tags enabled for every tag (rule `.*`), so this
# workflow only ever pushes version tags, and each one exactly once:
#   git tag v8.9.0    -> khashayar/rocketchat-arm64:8.9.0
#   git tag v8.9.0-1  -> khashayar/rocketchat-arm64:8.9.0-1  (rebuild of the
#                        same Rocket.Chat release, e.g. a base-image fix)
# No `latest` / branch tags: they would need overwriting, which Docker Hub
# refuses. A manual run on a branch builds without pushing (smoke test); a
# manual run on a tag ref publishes like a tag push.
# The `release: published` trigger was dropped: a release for an existing tag
# would re-push the same immutable tag and fail.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:

    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Rocket.Chat version and image tag
        id: rc-version
        run: |
          set -euo pipefail
          rc_version=$(grep -E '^ENV RC_VERSION=' Dockerfile | head -n 1 | cut -d= -f2)
          if [ -z "$rc_version" ]; then
            echo "Unable to locate RC_VERSION in Dockerfile" >&2
            exit 1
          fi
          echo "version=$rc_version" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            image_tag="${GITHUB_REF_NAME#v}"
            # The git tag must be the Dockerfile's RC_VERSION, optionally
            # followed by -<build number>. Catches tagging the wrong commit.
            if ! [[ "$image_tag" =~ ^${rc_version//./\\.}(-[0-9]+)?$ ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match RC_VERSION=${rc_version} (expected v${rc_version} or v${rc_version}-N)" >&2
              exit 1
            fi
            echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a tag ref (${GITHUB_REF_NAME}): building without pushing"
            echo "image_tag=${rc_version}-dev" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Verify registry credentials are configured
        if: steps.rc-version.outputs.push == 'true'
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_HUB_USER" ] || [ -z "$DOCKER_HUB_TOKEN" ]; then
            echo "DOCKER_HUB_USER and DOCKER_HUB_TOKEN secrets are required to push images" >&2
            exit 1
          fi

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.rc-version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.rc-version.outputs.image_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.rc-version.outputs.version }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ steps.rc-version.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
